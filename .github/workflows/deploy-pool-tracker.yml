name: Deploy World Cup Pool Tracker to Netlify

on:
  push:
    branches:
      - main
      - claude/football-league-tracker-2ijB9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://upzuvpogdracavcmxakp.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwenV2cG9nZHJhY2F2Y214YWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxODkzNzMsImV4cCI6MjA5NDc2NTM3M30._akzEANRa-ohHspeIzOF8lkn_--3eRLBL_YzpDLswFc
          VITE_ADMIN_PIN: ${{ secrets.VITE_ADMIN_PIN }}

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './dist'
          site-id: bcc74e86-b64a-46f7-961c-313573ba3799
          production-deploy: true
          deploy-message: "Deploy from GitHub Actions - ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
